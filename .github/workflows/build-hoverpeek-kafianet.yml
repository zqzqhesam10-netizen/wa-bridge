name: Build HoverPeek-KafiaNet

on:
  push:
    paths:
      - "hoverpeek-kafianet/**"
      - ".github/workflows/build-hoverpeek-kafianet.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish lightweight portable app
        shell: pwsh
        run: |
          $project = "hoverpeek-kafianet/src/HoverPeek.KafiaNet/HoverPeek.KafiaNet.csproj"
          $out = "$env:GITHUB_WORKSPACE/publish"
          dotnet publish $project -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false -o $out

          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/artifacts" | Out-Null
          7z a -tzip -mx=9 "$env:GITHUB_WORKSPACE/artifacts/HoverPeek-KafiaNet-win-x64.zip" "$out/*"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HoverPeek-KafiaNet-win-x64
          path: artifacts/HoverPeek-KafiaNet-win-x64.zip
          if-no-files-found: error
          retention-days: 30
